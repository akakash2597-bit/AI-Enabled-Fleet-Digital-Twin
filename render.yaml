services:
  - type: web
    name: ai-fleet-digital-twin
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python database/init_db.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
