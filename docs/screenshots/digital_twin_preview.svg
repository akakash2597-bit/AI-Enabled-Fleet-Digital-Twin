<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" style="background:#0b0f19; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(31, 41, 55, 0.8)"/>
      <stop offset="100%" stop-color="rgba(17, 24, 39, 0.95)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Window Header -->
  <rect x="20" y="20" width="960" height="540" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="48" rx="16" fill="#1f2937"/>
  <circle cx="48" cy="44" r="6" fill="#ef4444"/>
  <circle cx="68" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="44" r="6" fill="#10b981"/>
  <text x="500" y="49" fill="#9ca3af" font-size="13" font-weight="600" text-anchor="middle">FleetTwin AI — Cyber-Physical Digital Twin [VH-101: Tata Prima 5530.S]</text>

  <!-- Banner Card -->
  <rect x="40" y="85" width="920" height="90" rx="12" fill="url(#cardGrad)" stroke="#374151"/>
  <text x="65" y="122" fill="#3b82f6" font-size="12" font-weight="700" letter-spacing="1">VEHICLE TELEMETRY NODE</text>
  <text x="65" y="148" fill="#f9fafb" font-size="20" font-weight="800">VH-101: Tata Prima 5530.S (Heavy Haulage)</text>
  <circle cx="560" cy="132" r="5" fill="#10b981" filter="url(#glow)"/>
  <text x="575" y="136" fill="#10b981" font-size="12" font-weight="600">Physical-Virtual Twin Synchronized (Edge ECU Active)</text>

  <!-- KPI Gauges on Banner -->
  <rect x="740" y="98" width="100" height="64" rx="8" fill="#111827" stroke="#374151"/>
  <text x="790" y="120" fill="#9ca3af" font-size="10" font-weight="600" text-anchor="middle">TWIN HEALTH</text>
  <text x="790" y="146" fill="#10b981" font-size="22" font-weight="800" text-anchor="middle">94%</text>

  <rect x="850" y="98" width="95" height="64" rx="8" fill="#111827" stroke="#374151"/>
  <text x="897" y="120" fill="#9ca3af" font-size="10" font-weight="600" text-anchor="middle">FAILURE RISK</text>
  <text x="897" y="146" fill="#60a5fa" font-size="22" font-weight="800" text-anchor="middle">6.2%</text>

  <!-- Left: Subsystem Virtualization -->
  <rect x="40" y="195" width="450" height="345" rx="12" fill="url(#cardGrad)" stroke="#374151"/>
  <text x="60" y="225" fill="#f9fafb" font-size="16" font-weight="700">Subsystem Decomposition</text>
  <text x="60" y="242" fill="#9ca3af" font-size="11">Real-time mechanical health decomposition</text>

  <!-- Subsystem 1: Engine -->
  <g transform="translate(60, 260)">
    <rect width="410" height="42" rx="6" fill="#111827" stroke="#374151"/>
    <text x="15" y="26" fill="#f9fafb" font-size="12" font-weight="600">⚙️ Engine Core &amp; Pistons</text>
    <rect x="230" y="16" width="100" height="10" rx="5" fill="#374151"/>
    <rect x="230" y="16" width="92" height="10" rx="5" fill="#10b981"/>
    <text x="345" y="25" fill="#10b981" font-size="12" font-weight="700">92%</text>
    <rect x="375" y="12" width="26" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="388" y="25" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">OK</text>
  </g>

  <!-- Subsystem 2: Cooling -->
  <g transform="translate(60, 310)">
    <rect width="410" height="42" rx="6" fill="#111827" stroke="#374151"/>
    <text x="15" y="26" fill="#f9fafb" font-size="12" font-weight="600">❄️ Cooling System &amp; Radiator</text>
    <rect x="230" y="16" width="100" height="10" rx="5" fill="#374151"/>
    <rect x="230" y="16" width="96" height="10" rx="5" fill="#10b981"/>
    <text x="345" y="25" fill="#10b981" font-size="12" font-weight="700">96%</text>
    <rect x="375" y="12" width="26" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="388" y="25" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">OK</text>
  </g>

  <!-- Subsystem 3: Lubrication -->
  <g transform="translate(60, 360)">
    <rect width="410" height="42" rx="6" fill="#111827" stroke="#374151"/>
    <text x="15" y="26" fill="#f9fafb" font-size="12" font-weight="600">🛢️ Lubrication &amp; Oil Pump</text>
    <rect x="230" y="16" width="100" height="10" rx="5" fill="#374151"/>
    <rect x="230" y="16" width="94" height="10" rx="5" fill="#10b981"/>
    <text x="345" y="25" fill="#10b981" font-size="12" font-weight="700">94%</text>
    <rect x="375" y="12" width="26" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="388" y="25" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">OK</text>
  </g>

  <!-- Subsystem 4: Fuel Injection -->
  <g transform="translate(60, 410)">
    <rect width="410" height="42" rx="6" fill="#111827" stroke="#374151"/>
    <text x="15" y="26" fill="#f9fafb" font-size="12" font-weight="600">⛽ Fuel Rail &amp; Injectors</text>
    <rect x="230" y="16" width="100" height="10" rx="5" fill="#374151"/>
    <rect x="230" y="16" width="88" height="10" rx="5" fill="#10b981"/>
    <text x="345" y="25" fill="#10b981" font-size="12" font-weight="700">88%</text>
    <rect x="375" y="12" width="26" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="388" y="25" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">OK</text>
  </g>

  <!-- Subsystem 5: Transmission -->
  <g transform="translate(60, 460)">
    <rect width="410" height="42" rx="6" fill="#111827" stroke="#374151"/>
    <text x="15" y="26" fill="#f9fafb" font-size="12" font-weight="600">🔄 Transmission &amp; Drivetrain</text>
    <rect x="230" y="16" width="100" height="10" rx="5" fill="#374151"/>
    <rect x="230" y="16" width="95" height="10" rx="5" fill="#10b981"/>
    <text x="345" y="25" fill="#10b981" font-size="12" font-weight="700">95%</text>
    <rect x="375" y="12" width="26" height="18" rx="4" fill="rgba(16,185,129,0.2)"/>
    <text x="388" y="25" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">OK</text>
  </g>

  <!-- Right: Live Telemetry & Prescriptive Action -->
  <rect x="510" y="195" width="450" height="345" rx="12" fill="url(#cardGrad)" stroke="#374151"/>
  <text x="530" y="225" fill="#f9fafb" font-size="16" font-weight="700">Predictive Diagnostics &amp; RUL</text>
  <text x="530" y="242" fill="#9ca3af" font-size="11">ML inference driven by Logistic Regression Model</text>

  <!-- RUL Card -->
  <rect x="530" y="260" width="410" height="75" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="550" y="285" fill="#9ca3af" font-size="11" font-weight="600">ESTIMATED REMAINING USEFUL LIFE (RUL)</text>
  <text x="550" y="318" fill="#f9fafb" font-size="22" font-weight="800">⏳ 21,450 km (~358 Operating Hours)</text>

  <!-- Diagnostic Action -->
  <rect x="530" y="350" width="410" height="85" rx="8" fill="#111827" stroke="#374151"/>
  <text x="550" y="375" fill="#f59e0b" font-size="12" font-weight="700">🔧 Prescriptive Maintenance Checklist</text>
  <text x="550" y="398" fill="#e5e7eb" font-size="11">✓ Vehicle operates within nominal safety envelope.</text>
  <text x="550" y="418" fill="#9ca3af" font-size="11">Next scheduled overhaul at 65,000 km standard periodic window.</text>

  <!-- Simulator Quick Bar -->
  <rect x="530" y="450" width="410" height="70" rx="8" fill="#1e293b" stroke="#374151"/>
  <text x="550" y="474" fill="#60a5fa" font-size="11" font-weight="700">LIVE SENSOR TELEMETRY SIMULATOR</text>
  <text x="550" y="498" fill="#9ca3af" font-size="11">Engine RPM: 780 | Coolant: 78.5°C | Oil Pres: 3.4 bar | Fuel Pres: 6.2 bar</text>
</svg>
