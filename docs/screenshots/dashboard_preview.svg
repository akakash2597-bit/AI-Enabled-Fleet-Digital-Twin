<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" style="background:#0b0f19; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(31, 41, 55, 0.8)"/>
      <stop offset="100%" stop-color="rgba(17, 24, 39, 0.95)"/>
    </linearGradient>
  </defs>

  <!-- Window Shell -->
  <rect x="20" y="20" width="960" height="540" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <rect x="20" y="20" width="960" height="48" rx="16" fill="#1f2937"/>
  <circle cx="48" cy="44" r="6" fill="#ef4444"/>
  <circle cx="68" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="88" cy="44" r="6" fill="#10b981"/>
  <text x="500" y="49" fill="#9ca3af" font-size="13" font-weight="600" text-anchor="middle">Fleet Operations Digital Twin Dashboard — Overview</text>

  <!-- 4 Top KPI Cards -->
  <g transform="translate(40, 85)">
    <!-- Total Fleet -->
    <rect x="0" y="0" width="215" height="90" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
    <text x="20" y="30" fill="#9ca3af" font-size="11" font-weight="600">CONNECTED FLEET</text>
    <text x="20" y="65" fill="#f9fafb" font-size="28" font-weight="800">6</text>
    <text x="140" y="60" font-size="32">🚚</text>

    <!-- Operational -->
    <rect x="235" y="0" width="215" height="90" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
    <text x="255" y="30" fill="#9ca3af" font-size="11" font-weight="600">OPERATIONAL</text>
    <text x="255" y="65" fill="#10b981" font-size="28" font-weight="800">4</text>
    <text x="375" y="60" font-size="32">💚</text>

    <!-- Warning -->
    <rect x="470" y="0" width="215" height="90" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
    <text x="490" y="30" fill="#9ca3af" font-size="11" font-weight="600">DEGRADED / WARNING</text>
    <text x="490" y="65" fill="#f59e0b" font-size="28" font-weight="800">1</text>
    <text x="610" y="60" font-size="32">⚠️</text>

    <!-- Critical -->
    <rect x="705" y="0" width="215" height="90" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
    <text x="725" y="30" fill="#9ca3af" font-size="11" font-weight="600">CRITICAL RISK</text>
    <text x="725" y="65" fill="#ef4444" font-size="28" font-weight="800">1</text>
    <text x="845" y="60" font-size="32">🚨</text>
  </g>

  <!-- Middle Charts Row -->
  <!-- Donut Chart Card -->
  <rect x="40" y="195" width="310" height="190" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
  <text x="60" y="225" fill="#f9fafb" font-size="14" font-weight="700">Fleet Health Breakdown</text>
  <circle cx="195" cy="295" r="50" fill="none" stroke="#10b981" stroke-width="20" stroke-dasharray="210 100"/>
  <circle cx="195" cy="295" r="50" fill="none" stroke="#f59e0b" stroke-width="20" stroke-dasharray="52 260" stroke-dashoffset="-210"/>
  <circle cx="195" cy="295" r="50" fill="none" stroke="#ef4444" stroke-width="20" stroke-dasharray="52 260" stroke-dashoffset="-262"/>
  <text x="195" y="300" fill="#f9fafb" font-size="14" font-weight="800" text-anchor="middle">6 Units</text>

  <!-- Line Chart Card -->
  <rect x="370" y="195" width="590" height="190" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
  <text x="390" y="225" fill="#f9fafb" font-size="14" font-weight="700">Multi-Sensor Telemetry Trends</text>
  <text x="390" y="242" fill="#9ca3af" font-size="11">Aggregated Coolant Temp (°C) and Oil Pressure (bar)</text>
  <!-- Line wave -->
  <polyline fill="none" stroke="#ef4444" stroke-width="2.5" points="390,320 450,315 510,325 570,300 630,290 690,285 750,305 810,310 870,295 930,300"/>
  <polyline fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="4,4" points="390,340 450,335 510,338 570,330 630,325 690,320 750,330 810,335 870,332 930,330"/>

  <!-- Priority Vehicle Matrix Table -->
  <rect x="40" y="405" width="920" height="135" rx="10" fill="url(#cardGrad)" stroke="#374151"/>
  <text x="60" y="435" fill="#f9fafb" font-size="14" font-weight="700">Active High-Priority Attention Matrix</text>
  
  <rect x="60" y="450" width="880" height="35" rx="6" fill="#1e293b"/>
  <text x="75" y="472" fill="#ef4444" font-size="12" font-weight="700">VH-103</text>
  <text x="160" y="472" fill="#e5e7eb" font-size="12">BharatBenz 2823R</text>
  <text x="340" y="472" fill="#ef4444" font-size="12" font-weight="700">CRITICAL (88.4%)</text>
  <text x="510" y="472" fill="#e5e7eb" font-size="12">Engine Cooling Circuit (128°C Thermal Runaway)</text>
  <text x="850" y="472" fill="#60a5fa" font-size="11" font-weight="700">Inspect Twin →</text>

  <rect x="60" y="492" width="880" height="35" rx="6" fill="#111827"/>
  <text x="75" y="514" fill="#f59e0b" font-size="12" font-weight="700">VH-102</text>
  <text x="160" y="514" fill="#e5e7eb" font-size="12">Ashok Leyland AVTR</text>
  <text x="340" y="514" fill="#f59e0b" font-size="12" font-weight="700">WARNING (61.3%)</text>
  <text x="510" y="514" fill="#e5e7eb" font-size="12">Coolant Temperature Elevated (96°C)</text>
  <text x="850" y="514" fill="#60a5fa" font-size="11" font-weight="700">Inspect Twin →</text>
</svg>
