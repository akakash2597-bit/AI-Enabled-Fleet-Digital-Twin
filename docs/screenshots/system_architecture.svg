<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" style="background:#0b0f19; font-family:'Segoe UI', Inter, sans-serif;">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="500" y="40" fill="#f9fafb" font-size="22" font-weight="800" text-anchor="middle">Cyber-Physical Digital Twin Architecture</text>
  <text x="500" y="65" fill="#9ca3af" font-size="13" text-anchor="middle">End-to-End Edge Telemetry Stream, ML Inference Pipeline &amp; Synchronized State Engine</text>

  <!-- Layer 1: Physical Vehicle -->
  <g transform="translate(60, 100)">
    <rect width="240" height="380" rx="12" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="120" y="35" fill="#60a5fa" font-size="13" font-weight="700" text-anchor="middle">LAYER 1: PHYSICAL ASSET</text>
    <text x="120" y="60" fill="#f9fafb" font-size="16" font-weight="800" text-anchor="middle">Connected Commercial Fleet</text>
    <text x="120" y="110" font-size="44" text-anchor="middle">🚛</text>
    <rect x="20" y="140" width="200" height="215" rx="8" fill="#111827"/>
    <text x="35" y="165" fill="#9ca3af" font-size="11" font-weight="700">IoT Telemetry Sensors:</text>
    <text x="35" y="190" fill="#e5e7eb" font-size="11">• Crankshaft RPM Sensor</text>
    <text x="35" y="215" fill="#e5e7eb" font-size="11">• Oil Pressure Transducer</text>
    <text x="35" y="240" fill="#e5e7eb" font-size="11">• Fuel Rail Pressure Sensor</text>
    <text x="35" y="265" fill="#e5e7eb" font-size="11">• Coolant Pressure Line</text>
    <text x="35" y="290" fill="#e5e7eb" font-size="11">• Oil Sump Thermocouple</text>
    <text x="35" y="315" fill="#e5e7eb" font-size="11">• Block Coolant Thermistor</text>
    <text x="35" y="340" fill="#3b82f6" font-size="11" font-weight="600">Sampling Rate: 10 Hz Edge CAN</text>
  </g>

  <!-- Layer 2: Ingestion & ML Pipeline -->
  <g transform="translate(380, 100)">
    <rect width="240" height="380" rx="12" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="35" fill="#10b981" font-size="13" font-weight="700" text-anchor="middle">LAYER 2: AI &amp; DIGITAL TWIN</text>
    <text x="120" y="60" fill="#f9fafb" font-size="16" font-weight="800" text-anchor="middle">State &amp; Inference Engine</text>
    
    <rect x="20" y="85" width="200" height="65" rx="6" fill="#111827" stroke="#374151"/>
    <text x="30" y="105" fill="#60a5fa" font-size="11" font-weight="700">Flask REST Gateway</text>
    <text x="30" y="125" fill="#9ca3af" font-size="10">/api/predict &amp; /telemetry</text>
    <text x="30" y="140" fill="#9ca3af" font-size="10">Input Validation &amp; Auth</text>

    <rect x="20" y="160" width="200" height="75" rx="6" fill="#111827" stroke="#10b981"/>
    <text x="30" y="180" fill="#10b981" font-size="11" font-weight="700">Scikit-learn Model</text>
    <text x="30" y="200" fill="#e5e7eb" font-size="10">StandardScaler + LogisticReg</text>
    <text x="30" y="215" fill="#e5e7eb" font-size="10">87.8% Recall | 76.6% F1</text>
    <text x="30" y="228" fill="#9ca3af" font-size="9">Inference Latency: &lt;0.05 ms</text>

    <rect x="20" y="245" width="200" height="65" rx="6" fill="#111827" stroke="#374151"/>
    <text x="30" y="265" fill="#f59e0b" font-size="11" font-weight="700">Digital Twin State Engine</text>
    <text x="30" y="285" fill="#9ca3af" font-size="10">5 Subsystems Decomposition</text>
    <text x="30" y="300" fill="#9ca3af" font-size="10">RUL Estimation &amp; Diagnostics</text>

    <rect x="20" y="320" width="200" height="45" rx="6" fill="#111827" stroke="#374151"/>
    <text x="30" y="340" fill="#a855f7" font-size="11" font-weight="700">SQLite Persistence Store</text>
    <text x="30" y="355" fill="#9ca3af" font-size="10">Vehicles &bull; Telemetry &bull; Alerts</text>
  </g>

  <!-- Layer 3: Presentation UI -->
  <g transform="translate(700, 100)">
    <rect width="240" height="380" rx="12" fill="url(#boxGrad)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="120" y="35" fill="#818cf8" font-size="13" font-weight="700" text-anchor="middle">LAYER 3: USER EXPERIENCE</text>
    <text x="120" y="60" fill="#f9fafb" font-size="16" font-weight="800" text-anchor="middle">Fleet Dashboard &amp; Twin</text>
    <text x="120" y="110" font-size="44" text-anchor="middle">💻</text>
    <rect x="20" y="140" width="200" height="215" rx="8" fill="#111827"/>
    <text x="35" y="165" fill="#9ca3af" font-size="11" font-weight="700">Modern Cyber UI:</text>
    <text x="35" y="190" fill="#e5e7eb" font-size="11">• Operations Dashboard</text>
    <text x="35" y="215" fill="#e5e7eb" font-size="11">• 2D Digital Twin View</text>
    <text x="35" y="240" fill="#e5e7eb" font-size="11">• Interactive Sliders &amp; Presets</text>
    <text x="35" y="265" fill="#e5e7eb" font-size="11">• Chart.js Telemetry Graphs</text>
    <text x="35" y="290" fill="#e5e7eb" font-size="11">• Prescriptive Work Orders</text>
    <text x="35" y="315" fill="#e5e7eb" font-size="11">• Admin Session Security</text>
    <text x="35" y="340" fill="#10b981" font-size="11" font-weight="600">Responsive Dark Theme</text>
  </g>

  <!-- Connectors -->
  <line x1="300" y1="290" x2="380" y2="290" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="290" x2="700" y2="290" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="340" y="275" fill="#3b82f6" font-size="10" font-weight="700" text-anchor="middle">JSON Stream</text>
  <text x="660" y="275" fill="#3b82f6" font-size="10" font-weight="700" text-anchor="middle">State Sync</text>
</svg>
